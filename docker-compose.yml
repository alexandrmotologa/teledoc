services:
  teledoc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teledoc
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-true}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - STORAGE_DIR=/app/storage
    volumes:
      - teledoc_data:/app/storage

volumes:
  teledoc_data:
    driver: local
